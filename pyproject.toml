[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fga-taxoptimizer"
version = "0.0.1"
description = "FGA tax planning tool: Python conversion of TaxRetirementOptimizer.xlsx"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
excel = ["xlwings>=0.31"]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
