[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fga-taxoptimizer"
version = "1.0.0"
description = "FGA tax planning tool: Python conversion of TaxRetirementOptimizer.xlsx"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
app = ["streamlit>=1.40", "reportlab>=4.0", "openpyxl>=3.1"]
excel = ["xlwings>=0.31"]
dev = ["pytest>=8", "hypothesis>=6", "streamlit>=1.40", "reportlab>=4.0", "pypdf>=4.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
